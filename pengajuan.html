<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengajuan Stok - Sales</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="brand-logo">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <div class="header-text">
          <h1>Pengajuan Stok</h1>
          <p>Pilih barang yang dibutuhkan → Klik Ajukan Stok</p>
        </div>
      </div>
      <div class="header-right">
        <div class="portal-badge">
          <span class="portal-dot"></span>
          <span>Sales Portal</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- IDENTITY FORM -->
    <div class="identity-card">

      <!-- Tanggal -->
      <div class="field-group">
        <label class="field-label" for="tanggalInput">Tanggal</label>
        <input type="date" id="tanggalInput" class="field-input">
      </div>

      <!-- Nama Sales -->
      <div class="field-group">
        <label class="field-label" for="salesNameInput">Nama Sales <span>*</span></label>
        <input type="text" id="salesNameInput" class="field-input" placeholder="Nama kamu..." autocomplete="name">
      </div>

      <!-- Catatan -->
      <div class="field-group catatan-row">
        <label class="field-label" for="catatanInput">Catatan / Keterangan (Opsional)</label>
        <input type="text" id="catatanInput" class="field-input" placeholder="Misal: Stok etalase hampir habis...">
      </div>

    </div>

    <!-- PRODUCT SECTION -->
    <div class="section-header">
      <div class="section-title">
        <div class="title-left">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          <span>Pilih Barang yang Diajukan</span>
        </div>
        <span id="badgeSelected" class="badge-selected zero">0</span>
      </div>

      <div class="filter-row">
        <button id="btnOnlySelected" class="btn-filter" onclick="toggleOnlySelected()">Pilihan saja</button>
        <div class="search-wrap">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="searchBox" class="search-input" placeholder="Cari barang..." oninput="renderGrid()">
        </div>
      </div>
    </div>

    <!-- PRODUCT GRID -->
    <div id="productGrid" class="product-grid">
      <!-- Rendered by JS -->
    </div>

  </main>

  <!-- ===== STICKY BOTTOM BAR ===== -->
  <div class="sticky-bar">
    <div class="sticky-bar-inner">

      <div class="summary-info">
        <div id="summaryCount" class="summary-count zero">0</div>
        <div class="summary-text">
          <strong id="summaryMain">0 barang dipilih</strong>
          <small id="summarySub">Centang barang yang ingin diajukan</small>
        </div>
      </div>

      <button id="btnSubmit" class="btn-submit" disabled onclick="handleSubmit()">
        <!-- WA Icon -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.592 2.654-.697c.969.529 1.777.784 2.806.784 3.181 0 5.767-2.587 5.768-5.766.001-3.182-2.585-5.766-5.768-5.766zm6.839 5.766c-.002 3.768-3.072 6.838-6.84 6.838-1.139 0-2.228-.291-3.197-.812l-3.833 1.006 1.026-3.738c-.611-.99-1.036-2.146-1.038-3.294.002-3.768 3.073-6.838 6.842-6.838 3.769 0 6.84 3.07 6.84 6.838z"/>
        </svg>
        <span id="btnSubmitText">Ajukan Stok</span>
      </button>

    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div id="toast" class="toast" role="alert"></div>

  <!-- ===== JS ===== -->
  <script src="js/script.js"></script>

</body>
</html>
