<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restok Produk</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased selection:bg-blue-600 selection:text-white pb-24">

  <!-- ================= HEADER MODERN ================= -->
  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-sm shadow-blue-500/20 hover:opacity-90 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
        </a>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">Restok Produk</h1>
          <p class="text-xs text-slate-500">Pencatatan alokasi & penjualan barang</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">
          <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
          <span>Online</span>
        </span>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTAINER ================= -->
  <main class="max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 flex-grow">
    
    <!-- NOTIFIKASI TOAST -->
    <div id="alertBox" class="hidden mb-5 p-4 rounded-xl text-sm font-medium fade-in shadow-sm transition-all" role="alert">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <span id="alertIcon"></span>
          <span id="alertMessage">Data berhasil disimpan!</span>
        </div>
        <button type="button" onclick="closeAlert()" class="text-slate-400 hover:text-slate-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- PANEL KONTROL: TANGGAL, NAMA SALES & PENCARIAN -->
    <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs mb-6">
      <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3">
        
        <!-- Input Tanggal -->
        <div class="flex items-center gap-2.5 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 w-full lg:w-56 flex-shrink-0">
          <svg class="w-4 h-4 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <div class="flex flex-col flex-grow">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider leading-none">Tanggal</span>
            <input 
              type="date" 
              id="tanggalInput" 
              class="bg-transparent text-xs font-bold text-slate-800 outline-none cursor-pointer mt-0.5"
            >
          </div>
        </div>

        <!-- Input Nama Sales -->
        <div class="flex items-center gap-2.5 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 w-full lg:w-64 flex-shrink-0 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 transition">
          <svg class="w-4 h-4 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <div class="flex flex-col flex-grow">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider leading-none">Nama Sales <span class="text-rose-500">*</span></span>
            <input 
              type="text" 
              id="salesNameInput" 
              placeholder="Contoh: Budi, Sarah..." 
              autocomplete="name"
              class="bg-transparent text-xs font-bold text-slate-800 placeholder-slate-400 outline-none mt-0.5"
            >
          </div>
        </div>

        <!-- Kolom Pencarian Cepat Produk -->
        <div class="relative flex-grow">
          <input 
            type="text" 
            id="searchBox" 
            placeholder="Cari nama produk (misal: Selena, Chanel, White aoud)..." 
            oninput="filterProducts(this.value)"
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 text-xs text-slate-800 outline-none transition"
          >
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <!-- Tombol Kosongkan -->
        <button 
          type="button" 
          onclick="resetAllInputs()" 
          class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-100 text-xs font-semibold flex items-center justify-center gap-1.5 transition cursor-pointer flex-shrink-0"
        >
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Kosongkan</span>
        </button>

      </div>
    </div>

    <!-- PETUNJUK & STATISTIK RINGKAS -->
    <div class="flex items-center justify-between mb-3.5 px-1 text-xs text-slate-500">
      <div>
        Daftar <span id="displayedCount" class="font-bold text-slate-800">21</span> produk. Masukkan kuantitas pada produk yang tersedia.
      </div>
      <div id="filledCounterText" class="font-bold text-blue-700">
        0 produk terisi
      </div>
    </div>

    <!-- FORM UTAMA DENGAN GRID PRODUK MODERN -->
    <form id="restockForm" onsubmit="handleFormSubmit(event)">
      <!-- GRID 21 PRODUK (MODERN & RESPONSIVE) -->
      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 mb-10">
        <!-- Item produk dirender lewat JavaScript -->
      </div>
    </form>

  </main>

  <!-- ================= STICKY ACTION BAR BAWAH ================= -->
  <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-xl py-3 px-4 sm:px-6 z-40">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      
      <!-- Counter Ringkasan -->
      <div class="flex items-center gap-3">
        <span id="filledBadge" class="w-8 h-8 rounded-xl bg-blue-100 text-blue-800 font-bold text-xs flex items-center justify-center">
          0
        </span>
        <div>
          <span class="font-bold text-xs sm:text-sm text-slate-900" id="summaryText">0 produk diisi</span>
          <span class="text-slate-400 text-xs hidden sm:inline ml-1">•</span>
          <span class="text-slate-500 text-xs block sm:inline ml-0 sm:ml-1" id="totalQtyText">Total 0 pcs</span>
        </div>
      </div>

      <!-- Tombol Simpan Utama -->
      <div class="flex items-center gap-2">
        <button 
          type="button" 
          onclick="resetAllInputs()" 
          class="hidden sm:inline-block px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition cursor-pointer"
        >
          Reset
        </button>
        <button 
          type="button" 
          id="btnSubmit" 
          onclick="handleFormSubmit(event)"
          disabled
          class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold text-xs sm:text-sm shadow-md shadow-blue-600/20 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none flex items-center gap-2 transition cursor-pointer"
        >
          <svg id="submitSpinner" class="hidden animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span id="submitBtnText">Simpan Restok</span>
        </button>
      </div>

    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPJ37XvPfBI3U4_GxvVMYY9hn-PoScgMQOPJyA1c1xgAyDohdrvdRvPDurh4Gco2GD/exec";
    const PENANDA_DIVISI = "Sales";
    const STORAGE_KEY = "restok_history_sales";

    // DAFTAR 21 PRODUK
    const PRODUCTS = [
      "Selena",
      "D&g light blue",
      "Lacoste Sport",
      "Maid Prince",
      "Poloish",
      "Imperial",
      "White aoud",
      "Mia Tabac",
      "Coco Chanel",
      "Tobacco vanilla",
      "Al rehab lovely",
      "Indigo",
      "Vision",
      "Aqua kiss",
      "Roman 1a",
      "Pramugari air",
      "Purenol",
      "Body Wash (Tanpa Aroma)",
      "Body mist (Tanpa Aroma)",
      "Deodorant (Tanpa Aroma)",
      "Botol Parfum (Kosongan)"
    ];

    const quantities = {};

    // DOM Elements
    const grid = document.getElementById('productGrid');
    const tanggalInput = document.getElementById('tanggalInput');
    const salesNameInput = document.getElementById('salesNameInput');
    const searchBox = document.getElementById('searchBox');
    const displayedCount = document.getElementById('displayedCount');
    const filledCounterText = document.getElementById('filledCounterText');
    const filledBadge = document.getElementById('filledBadge');
    const summaryText = document.getElementById('summaryText');
    const totalQtyText = document.getElementById('totalQtyText');
    const btnSubmit = document.getElementById('btnSubmit');
    const submitBtnText = document.getElementById('submitBtnText');
    const submitSpinner = document.getElementById('submitSpinner');
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');
    const alertIcon = document.getElementById('alertIcon');

    document.addEventListener('DOMContentLoaded', () => {
      // Inisialisasi Tanggal Hari Ini
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      tanggalInput.value = `${yyyy}-${mm}-${dd}`;

      // Muat nama sales yang terakhir digunakan jika ada
      const savedSalesName = localStorage.getItem('last_sales_name');
      if (savedSalesName && salesNameInput) {
        salesNameInput.value = savedSalesName;
      }

      // Inisialisasi State
      PRODUCTS.forEach(p => {
        quantities[p] = 0;
      });

      renderProductGrid();
    });

    // Render Grid Produk Modern
    function renderProductGrid() {
      const keyword = searchBox.value.toLowerCase().trim();
      grid.innerHTML = '';

      const filtered = PRODUCTS.filter(p => p.toLowerCase().includes(keyword));
      displayedCount.textContent = filtered.length;

      filtered.forEach((prod, idx) => {
        const qty = quantities[prod] || 0;
        const isFilled = qty > 0;

        const card = document.createElement('div');
        card.id = `card-${escapeId(prod)}`;
        card.className = `product-card bg-white rounded-xl border ${isFilled ? 'border-blue-500 bg-blue-50/20 shadow-xs ring-1 ring-blue-500/20' : 'border-slate-200 hover:border-slate-300'} p-3.5 transition flex items-center justify-between gap-3`;
        card.dataset.name = prod.toLowerCase();

        card.innerHTML = `
          <div class="flex-grow min-w-0">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">#${idx + 1}</span>
            <label for="prod-${escapeId(prod)}" class="text-xs font-bold text-slate-900 block truncate cursor-pointer leading-tight mt-0.5">
              ${prod}
            </label>
          </div>

          <!-- Input Manual Jumlah -->
          <div class="relative flex-shrink-0 w-28">
            <input 
              type="number" 
              min="0"
              id="prod-${escapeId(prod)}" 
              placeholder="0"
              value="${qty > 0 ? qty : ''}"
              oninput="handleQtyInput('${prod}', this.value)"
              class="w-full pl-3 pr-8 py-1.5 text-right text-xs font-bold text-slate-900 rounded-lg border ${isFilled ? 'border-blue-500 bg-white focus:ring-2 focus:ring-blue-500/20' : 'border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500'} outline-none transition"
            >
            <span class="absolute right-2.5 top-2 text-[10px] font-medium text-slate-400 pointer-events-none">pcs</span>
          </div>
        `;
        grid.appendChild(card);
      });

      updateSummaryBar();
    }

    function escapeId(str) {
      return str.replace(/[^a-zA-Z0-9]/g, '_');
    }

    function handleQtyInput(prodName, val) {
      const parsed = parseInt(val, 10);
      const qty = isNaN(parsed) || parsed < 0 ? 0 : parsed;
      quantities[prodName] = qty;

      const card = document.getElementById(`card-${escapeId(prodName)}`);
      const input = document.getElementById(`prod-${escapeId(prodName)}`);

      if (card && input) {
        if (qty > 0) {
          card.className = "product-card bg-white rounded-xl border border-blue-500 bg-blue-50/20 shadow-xs ring-1 ring-blue-500/20 p-3.5 transition flex items-center justify-between gap-3";
          input.className = "w-full pl-3 pr-8 py-1.5 text-right text-xs font-bold text-slate-900 rounded-lg border border-blue-500 bg-white focus:ring-2 focus:ring-blue-500/20 outline-none transition";
        } else {
          card.className = "product-card bg-white rounded-xl border border-slate-200 hover:border-slate-300 p-3.5 transition flex items-center justify-between gap-3";
          input.className = "w-full pl-3 pr-8 py-1.5 text-right text-xs font-bold text-slate-900 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500 outline-none transition";
        }
      }

      updateSummaryBar();
    }

    function filterProducts(keyword) {
      const kw = keyword.toLowerCase().trim();
      const cards = document.querySelectorAll('.product-card');
      let visibleCount = 0;
      cards.forEach(c => {
        if (!kw || c.dataset.name.includes(kw)) {
          c.classList.remove('hidden');
          visibleCount++;
        } else {
          c.classList.add('hidden');
        }
      });
      displayedCount.textContent = visibleCount;
    }

    function updateSummaryBar() {
      let filledCount = 0;
      let totalQty = 0;

      Object.keys(quantities).forEach(k => {
        const q = quantities[k];
        if (q > 0) {
          filledCount++;
          totalQty += q;
        }
      });

      filledBadge.textContent = filledCount;
      summaryText.textContent = `${filledCount} produk diisi`;
      totalQtyText.textContent = `Total ${totalQty.toLocaleString('id-ID')} pcs`;
      filledCounterText.textContent = `${filledCount} produk terisi`;
      btnSubmit.disabled = filledCount === 0;
    }

    function resetAllInputs() {
      if (confirm('Kosongkan semua jumlah produk yang telah diisi?')) {
        PRODUCTS.forEach(p => {
          quantities[p] = 0;
          const input = document.getElementById(`prod-${escapeId(p)}`);
          if (input) input.value = '';
          const card = document.getElementById(`card-${escapeId(p)}`);
          if (card) {
            card.className = "product-card bg-white rounded-xl border border-slate-200 hover:border-slate-300 p-3.5 transition flex items-center justify-between gap-3";
          }
        });
        updateSummaryBar();
      }
    }

    // Submit Data
    async function handleFormSubmit(e) {
      if (e) e.preventDefault();

      const tanggal = tanggalInput.value;
      if (!tanggal) {
        showAlert('Tanggal wajib diisi!', true);
        return;
      }

      const namaSales = (salesNameInput.value || '').trim();
      if (!namaSales) {
        showAlert('Nama Sales wajib diisi!', true);
        salesNameInput.focus();
        return;
      }

      const itemsToSave = [];
      Object.keys(quantities).forEach(prod => {
        if (quantities[prod] > 0) {
          itemsToSave.push({ namaProduk: prod, jumlahProduk: quantities[prod] });
        }
      });

      if (itemsToSave.length === 0) {
        showAlert('Isi jumlah minimal pada salah satu produk!', true);
        return;
      }

      // Simpan nama sales terakhir ke localStorage
      localStorage.setItem('last_sales_name', namaSales);

      btnSubmit.disabled = true;
      submitSpinner.classList.remove('hidden');
      submitBtnText.textContent = 'Menyimpan...';

      try {
        const payload = {
          penanda: PENANDA_DIVISI,
          tanggal: tanggal,
          namaSales: namaSales,
          items: itemsToSave
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });

        const result = await res.json();

        if (result.status === 'success') {
          // Simpan ke cache lokal agar dashboard langsung tersinkron
          saveLocalHistoryCache(itemsToSave, tanggal, namaSales);

          // Reset nilai form
          PRODUCTS.forEach(p => {
            quantities[p] = 0;
            const input = document.getElementById(`prod-${escapeId(p)}`);
            if (input) input.value = '';
            const card = document.getElementById(`card-${escapeId(p)}`);
            if (card) {
              card.className = "product-card bg-white rounded-xl border border-slate-200 hover:border-slate-300 p-3.5 transition flex items-center justify-between gap-3";
            }
          });

          updateSummaryBar();
          showAlert(`Berhasil menyimpan ${itemsToSave.length} produk untuk Sales "${namaSales}" ke database!`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          // Fallback sequential
          let successCount = 0;
          for (const item of itemsToSave) {
            try {
              const sRes = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                  penanda: PENANDA_DIVISI,
                  tanggal: tanggal,
                  namaSales: namaSales,
                  namaProduk: item.namaProduk,
                  jumlahProduk: item.jumlahProduk
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
              });
              const sData = await sRes.json();
              if (sData.status === 'success') {
                successCount++;
              }
            } catch (err) {
              console.error(err);
            }
          }

          saveLocalHistoryCache(itemsToSave, tanggal, namaSales);

          PRODUCTS.forEach(p => {
            quantities[p] = 0;
            const input = document.getElementById(`prod-${escapeId(p)}`);
            if (input) input.value = '';
          });
          updateSummaryBar();
          showAlert(`Selesai! ${successCount} produk berhasil dicatat untuk Sales "${namaSales}".`);
        }

      } catch (err) {
        console.error(err);
        showAlert('Gagal mengirim data: ' + err.message, true);
      } finally {
        btnSubmit.disabled = false;
        submitSpinner.classList.add('hidden');
        submitBtnText.textContent = 'Simpan Restok';
      }
    }

    function saveLocalHistoryCache(items, tanggal, namaSales) {
      try {
        let stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        items.forEach(it => {
          stored.unshift({
            tanggal: tanggal,
            namaSales: namaSales || '',
            namaProduk: it.namaProduk,
            jumlahProduk: it.jumlahProduk
          });
        });
        if (stored.length > 100) stored = stored.slice(0, 100);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
      } catch (e) {}
    }

    function showAlert(msg, isError = false) {
      alertBox.classList.remove('hidden');
      alertMessage.textContent = msg;
      if (isError) {
        alertBox.className = 'mb-5 p-4 rounded-xl text-sm font-medium fade-in shadow-xs bg-rose-50 border border-rose-200 text-rose-950 flex items-center justify-between';
        alertIcon.innerHTML = `<span class="w-5 h-5 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center font-bold text-xs">!</span>`;
      } else {
        alertBox.className = 'mb-5 p-4 rounded-xl text-sm font-medium fade-in shadow-xs bg-blue-50 border border-blue-200 text-blue-950 flex items-center justify-between';
        alertIcon.innerHTML = `<span class="w-5 h-5 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs">✓</span>`;
      }
    }

    function closeAlert() {
      alertBox.classList.add('hidden');
    }
  </script>
</body>
</html>
